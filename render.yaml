services:
  - type: web
    name: ubid-api
    runtime: python
    buildCommand: pip install . && python scripts/run_pipeline.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: src
      - key: PYTHON_VERSION
        value: "3.10"
